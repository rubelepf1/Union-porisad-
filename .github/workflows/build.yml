name: Build APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Check Gradle version
        run: gradle --version

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Ensure Debug Keystore Exists
        run: |
          DEBUG_KEYSTORE="$HOME/.config/.android/debug.keystore"

          mkdir -p "$HOME/.config/.android"
          mkdir -p "$HOME/.android"

          if [ ! -f "$DEBUG_KEYSTORE" ]; then
            echo "Creating debug keystore..."

            keytool -genkeypair \
              -v \
              -keystore "$DEBUG_KEYSTORE" \
              -storepass android \
              -alias AndroidDebugKey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          cp "$DEBUG_KEYSTORE" "$HOME/.android/debug.keystore" 2>/dev/null || true

          echo "Debug keystore created:"
          ls -l "$DEBUG_KEYSTORE"

      - name: Get Debug SHA-1
        run: |
          echo "===== DEBUG SIGNING REPORT ====="
          gradle signingReport

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Find generated APK
        run: |
          echo "Generated APK files:"
          find app/build/outputs/apk/debug -type f -name "*.apk" -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
