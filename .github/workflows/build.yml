name: Build APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Check Gradle version
        run: gradle --version

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Setup Stable Debug Keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          mkdir -p "$HOME/.config/.android"

          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 GitHub Secret is required for stable debug signing."
            exit 1
          fi

          echo "Restoring stable debug keystore from GitHub Secret..."
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          cp "$HOME/.android/debug.keystore" "$HOME/.config/.android/debug.keystore"
          echo "Stable debug keystore restored successfully."

      - name: Get Debug SHA-1
        run: |
          echo "===== DEBUG SIGNING REPORT ====="
          gradle signingReport

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Find generated APK
        run: |
          echo "Generated APK files:"
          find app/build/outputs/apk/debug -type f -name "*.apk" -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
